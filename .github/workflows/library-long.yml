name: Library LONG Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  long:
    name: Linux Full LONG
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout SpectralShipGen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure LONG regression build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DSPECTRAL_SHIP_GEN_BUILD_DIAGNOSTICS=ON
          -DSPECTRAL_SHIP_GEN_BUILD_DIAGNOSTICS_CLI=OFF
          -DSPECTRAL_SHIP_GEN_BUILD_EXAMPLES=OFF
          -DSPECTRAL_SHIP_GEN_BUILD_CORE_REGRESSION=ON
          -DSPECTRAL_SHIP_GEN_BUILD_PUBLIC_HEADER_CHECKS=OFF

      - name: Build regression runner
        run: cmake --build build --config Release --target SpectralShipGenRegression --parallel

      - name: Run NORMAL and LONG suites
        run: ./build/bin/SpectralShipGenRegression --all --include-long
